# KOne's version as people see it: Settings → App shows "KOne 1.0.0".
KONE_VERSION=1.0.0
# The build number Android compares (versionCode). It must rise with every build that is
# installed or handed out, whatever KONE_VERSION says: a phone refuses an install with a lower
# one unless the App is uninstalled first, which loses its data. 10006 is KOne 1.0.6 (2026-10-13).
KONE_BUILD=10056
