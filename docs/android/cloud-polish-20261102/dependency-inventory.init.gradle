import groovy.json.JsonOutput
import java.security.MessageDigest
// Observation only: these hashes are not accepted dependency-verification metadata.
gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    def probePath = System.getenv('KONE_DEPENDENCY_LOCK_PROBE')
    if (probePath) {
        def probe = new File(probePath).canonicalFile
        if (probe.path.startsWith(gradle.rootProject.rootDir.canonicalPath + File.separator)) {
            throw new GradleException('Keep the experimental lock outside the source checkout')
        }
        probe.parentFile.mkdirs()
        app.dependencyLocking.lockFile.set(probe)
        app.dependencyLocking.lockMode.set(org.gradle.api.artifacts.dsl.LockMode.STRICT)
        app.configurations.getByName('otherDebugRuntimeClasspath').resolutionStrategy.activateDependencyLocking()
    }
    app.tasks.register('candidateDependencyInventory') {
        doLast {
            def config = app.configurations.getByName('otherDebugRuntimeClasspath')
            def modules = config.incoming.resolutionResult.allComponents.findAll {
                it.id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier
            }.collect { "${it.id.group}:${it.id.module}:${it.id.version}".toString() }.sort()
            def artifacts = config.resolvedConfiguration.resolvedArtifacts.collect { artifact ->
                def hash = MessageDigest.getInstance('SHA-256')
                artifact.file.withInputStream { stream ->
                    byte[] buffer = new byte[65536]
                    int count
                    while ((count = stream.read(buffer)) != -1) hash.update(buffer, 0, count)
                }
                [coordinate:artifact.moduleVersion.id.toString(), file:artifact.file.name,
                    observed_sha256:hash.digest().encodeHex().toString()]
            }.sort { it.coordinate + ':' + it.file }
            def output = new File(System.getenv('KONE_DEPENDENCY_INVENTORY'))
            output.parentFile.mkdirs()
            output.text = JsonOutput.prettyPrint(JsonOutput.toJson([
                configuration:'otherDebugRuntimeClasspath', modules:modules,
                changing_modules:modules.findAll { it.contains('SNAPSHOT') }, artifacts:artifacts,
                note:'Observed resolution and local artifact digests only; not trusted verification metadata.'
            ])) + '\n'
            println "Dependency inventory: ${modules.size()} modules, ${artifacts.size()} artifacts, ${modules.count { it.contains('SNAPSHOT') }} changing modules"
        }
    }
}
